<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Clock</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f9f9f9;
      color: #111;
      transition: background 0.3s, color 0.3s;
    }
    .dark {
      background: #111;
      color: #f9f9f9;
    }
    #clock {
      font-size: 3em;
      letter-spacing: 2px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="clock"></div>
  <button onclick="toggleMode()">Toggle Light/Dark</button>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString("en-GB"); // HH:MM:SS
      document.getElementById("clock").textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
