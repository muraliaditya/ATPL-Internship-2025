<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input { margin: 5px; padding: 5px; width: 100px; }
    button { margin: 5px; padding: 8px 12px; cursor: pointer; }
    #result { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>
  <input type="number" id="num1" placeholder="First Number">
  <input type="number" id="num2" placeholder="Second Number"><br>
  <button onclick="calculate('add')">Add</button>
  <button onclick="calculate('sub')">Subtract</button>
  <button onclick="calculate('mul')">Multiply</button>
  <button onclick="calculate('div')">Divide</button>
  <p id="result"></p>

  <script>
    function calculate(op) {
      let a = parseFloat(document.getElementById("num1").value);
      let b = parseFloat(document.getElementById("num2").value);
      let res = "";
      if (isNaN(a) || isNaN(b)) {
        res = "Please enter both numbers!";
      } else {
        switch(op) {
          case 'add': res = a + b; break;
          case 'sub': res = a - b; break;
          case 'mul': res = a * b; break;
          case 'div': res = b !== 0 ? a / b : "Cannot divide by 0"; break;
        }
      }
      document.getElementById("result").innerText = "Result: " + res;
    }
  </script>
</body>
</html>
