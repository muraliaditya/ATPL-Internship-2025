<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi media</title>
    
</head>

<body>


    <div class="outer">
        <div class="inner"><img src="ex-pic01.jpg" width="250px" alt="image"></div>

        <div class="inner">
            <video controls autoplay>
                <source src="assemble.mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="inner">
            <audio controls>
                <source src="sample-3s.mp3">
                Your browser does not support the audio tag.
            </audio>
        </div>
    </div>
</body>

</html>
