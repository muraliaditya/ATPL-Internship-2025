<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Column Layout</title>
  <style>
    .container {
      width: 90%;
      margin: 20px auto;
      background: #eee;
    }
    .left {
      float: left;
      width: 30%;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
    }
    .right {
      float: left;
      width: 70%;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
    }
    .clearfix {
      clear: both;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">This is a side bar content.</div>
    <div class="right">This is main article content area.</div>
    <div class="clearfix"></div>
  </div>
</body>
</html>
