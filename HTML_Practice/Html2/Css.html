<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS MCQ</title>
</head>

<body>
    <div class="mcq">
        <h2>CSS MCQs - Answer all questions</h2> <br>
        <form action="result.html">
            <ol>
                <li><label>Which property is used to change the text color in CSS?</label><br>
                    <input type="radio" name="q1"><label>font-color</label><br>
                    <input type="radio" name="q1"><label>text-style</label><br>
                    <input type="radio" name="q1"><label>color</label><br>
                    <input type="radio" name="q1"><label>background-color</label><br><br>
                </li>

                <li><label>Which CSS property is used to control the size of text?</label><br>
                    <input type="radio" name="q2"><label>font-size</label><br>
                    <input type="radio" name="q2"><label>text-size</label><br>
                    <input type="radio" name="q2"><label>font-style</label><br>
                    <input type="radio" name="q2"><label>size</label><br><br>
                </li>

                <li><label>Which symbol is used before an ID selector in CSS?</label><br>
                    <input type="radio" name="q3"><label>#</label><br>
                    <input type="radio" name="q3"><label>.</label><br>
                    <input type="radio" name="q3"><label>*</label><br>
                    <input type="radio" name="q3"><label>&</label><br><br>
                </li>

                <li><label>Which CSS property is used to set the background color?</label><br>
                    <input type="radio" name="q4"><label>background</label><br>
                    <input type="radio" name="q4"><label>bgcolor</label><br>
                    <input type="radio" name="q4"><label>color</label><br>
                    <input type="radio" name="q4"><label>background-color</label><br><br>
                </li>

                <li><label>Which of the following positions an element relative to its first positioned ancestor?</label><br>
                    <input type="radio" name="q5"><label>fixed</label><br>
                    <input type="radio" name="q5"><label>relative</label><br>
                    <input type="radio" name="q5"><label>absolute</label><br>
                    <input type="radio" name="q5"><label>static</label><br><br>
                </li>
            </ol>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>

</html>
