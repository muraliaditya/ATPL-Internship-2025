<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML MCQ</title>
</head>

<body>
    <div class="mcq">
        <h2>HTML MCQs - Answer all questions</h2> <br>
        <form action="Css.html">
            <ol>
                <li><label>Which HTML tag is used to create a hyperlink?</label><br>
                    <input type="radio" name="q1"><label>&lt;link&gt;</label><br>
                    <input type="radio" name="q1"><label>&lt;a&gt;</label><br>
                    <input type="radio" name="q1"><label>&lt;href&gt;</label><br>
                    <input type="radio" name="q1"><label>&lt;hyper&gt;</label><br><br>
                </li>

                <li><label>Which tag is used to display an image in HTML?</label><br>
                    <input type="radio" name="q2"><label>&lt;src&gt;</label><br>
                    <input type="radio" name="q2"><label>&lt;image&gt;</label><br>
                    <input type="radio" name="q2"><label>&lt;img&gt;</label><br>
                    <input type="radio" name="q2"><label>&lt;pic&gt;</label><br><br>
                </li>

                <li><label>Which attribute is used to provide alternative text for an image?</label><br>
                    <input type="radio" name="q3"><label>title</label><br>
                    <input type="radio" name="q3"><label>alt</label><br>
                    <input type="radio" name="q3"><label>src</label><br>
                    <input type="radio" name="q3"><label>href</label><br><br>
                </li>

                <li><label>Which HTML element is used to define a table row?</label><br>
                    <input type="radio" name="q4"><label>&lt;tr&gt;</label><br>
                    <input type="radio" name="q4"><label>&lt;td&gt;</label><br>
                    <input type="radio" name="q4"><label>&lt;table&gt;</label><br>
                    <input type="radio" name="q4"><label>&lt;row&gt;</label><br><br>
                </li>

                <li><label>Which HTML tag is used to create an ordered list?</label><br>
                    <input type="radio" name="q5"><label>&lt;ol&gt;</label><br>
                    <input type="radio" name="q5"><label>&lt;ul&gt;</label><br>
                    <input type="radio" name="q5"><label>&lt;li&gt;</label><br>
                    <input type="radio" name="q5"><label>&lt;list&gt;</label><br><br>
                </li>
            </ol>
            <input type="submit" value="Next">
        </form>
    </div>
</body>

</html>
