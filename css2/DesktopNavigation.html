<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesktopNavigation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        nav{
            background-color:gray;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            padding: 10px;
        }
        .internal{
            text-align: center;
            padding:10px;
            border-radius: 3px;
            font-weight: bold;
            color: aliceblue;
        }

        .internal:hover{
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <nav>
        
        <div class="internal">Home</div>
        <div class="internal">Services</div>
        <div class="internal">About</div>
        <div class="internal">Contact</div>
    </nav>
</body>
</html>
