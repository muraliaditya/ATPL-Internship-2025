<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Calculator</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 30px; }
    input { margin: 5px; padding: 5px; width: 80px; }
    #grade { font-size: 18px; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Grade Calculator</h2>
  <div>
    <input type="number" id="s1" placeholder="Subj 1">
    <input type="number" id="s2" placeholder="Subj 2">
    <input type="number" id="s3" placeholder="Subj 3">
    <input type="number" id="s4" placeholder="Subj 4">
    <input type="number" id="s5" placeholder="Subj 5"><br>
    <button onclick="calcGrade()">Calculate</button>
  </div>
  <p id="grade"></p>

  <script>
    function calcGrade() {
      let marks = [];
      for(let i=1; i<=5; i++){
        let val = parseInt(document.getElementById("s"+i).value);
        if(isNaN(val)){ alert("Enter all marks!"); return; }
        marks.push(val);
      }
      let total = marks.reduce((a,b)=>a+b,0);
      let avg = total / 5;
      let grade;
      if(avg >= 90) grade = "A";
      else if(avg >= 75) grade = "B";
      else if(avg >= 60) grade = "C";
      else if(avg >= 40) grade = "D";
      else grade = "F";

      let gradeEl = document.getElementById("grade");
      gradeEl.innerText = `Total: ${total}, Avg: ${avg.toFixed(2)}, Grade: ${grade}`;
      gradeEl.style.color = (grade === "F") ? "red" : "green";
    }
  </script>
</body>
</html>
