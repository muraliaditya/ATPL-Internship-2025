<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Bar</title>
  <style>
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: #333;
      text-align: center;
    }
    li {
      display: inline-block;
      margin: 0;
    }
    li a {
      display: block;
      padding: 15px 20px;
      color: white;
      text-decoration: none;
    }
    li a:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Products</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</body>
</html>
