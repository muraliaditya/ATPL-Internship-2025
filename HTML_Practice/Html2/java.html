<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java MCQ</title>
</head>

<body>
    <div class="mcq">
        <h2>Please answer every question</h2> <br>
        <form action="Html.html">
            <ol>
                <li> <label>Which of the following is not a Java feature?</label><br>
                    <input type="radio" name="q1">
                    <label>Object-Oriented</label><br>
                    <input type="radio" name="q1">
                    <label>Use of pointers</label><br>
                    <input type="radio" name="q1">
                    <label>Portable</label><br>
                    <input type="radio" name="q1">
                    <label>Platform Independent</label><br><br>
                </li>

                <li> <label>Which keyword is used to inherit a class in Java?</label><br>
                    <input type="radio" name="q2">
                    <label>this</label><br>
                    <input type="radio" name="q2">
                    <label>super</label><br>
                    <input type="radio" name="q2">
                    <label>extends</label><br>
                    <input type="radio" name="q2">
                    <label>implements</label><br><br>
                </li>

                <li> <label>Which of the following is a marker interface in Java?</label><br>
                    <input type="radio" name="q3">
                    <label>Serializable</label><br>
                    <input type="radio" name="q3">
                    <label>Cloneable</label><br>
                    <input type="radio" name="q3">
                    <label>Remote</label><br>
                    <input type="radio" name="q3">
                    <label>All of the above</label><br><br>
                </li>

                <li> <label>Which of these is the correct signature of the main() method in Java?</label><br>
                    <input type="radio" name="q4">
                    <label>public static void main(String args)</label><br>
                    <input type="radio" name="q4">
                    <label>public static void main(String[] args)</label><br>
                    <input type="radio" name="q4">
                    <label>public void main(String[] args)</label><br>
                    <input type="radio" name="q4">
                    <label>static public void main(String args[])</label><br><br>
                </li>

                <li> <label>Which of the following is the parent class of all classes in Java?</label><br>
                    <input type="radio" name="q5">
                    <label>Object</label><br>
                    <input type="radio" name="q5">
                    <label>Class</label><br>
                    <input type="radio" name="q5">
                    <label>System</label><br>
                    <input type="radio" name="q5">
                    <label>Runtime</label><br><br>
                </li>
            </ol>
            <input type="submit" value="Next">
        </form>
    </div>
</body>

</html>
