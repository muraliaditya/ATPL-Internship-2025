<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; max-width: 520px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; }
    button { padding: 10px 12px; }
    ul { list-style: none; padding: 0; margin-top: 16px; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 12px;
         border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .title { flex: 1; cursor: pointer; }
    .done { text-decoration: line-through; color: #666; }
    .muted { color: #666; font-size: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>To-Do List</h2>

  <form id="todo-form" autocomplete="off">
    <input id="task-input" type="text" placeholder="What needs to be done?" />
    <button type="submit">Add</button>
  </form>
  <div class="muted">Tip: Click a task to toggle complete.</div>

  <ul id="list"></ul>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('list');

    let tasks = load();

    render();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: crypto.randomUUID(), text, done: false });
      input.value = '';
      save(); render();
    });

    // Event delegation: toggle or delete
    list.addEventListener('click', (e) => {
      const li = e.target.closest('li[data-id]');
      if (!li) return;
      const id = li.dataset.id;

      if (e.target.matches('button.delete')) {
        tasks = tasks.filter(t => t.id !== id);
        save(); render();
        return;
      }
      if (e.target.matches('.title')) {
        const t = tasks.find(t => t.id === id);
        if (t) { t.done = !t.done; save(); render(); }
      }
    });

    function render() {
      list.innerHTML = '';
      if (tasks.length === 0) return;

      for (const t of tasks) {
        const li = document.createElement('li');
        li.dataset.id = t.id;

        const span = document.createElement('span');
        span.className = 'title' + (t.done ? ' done' : '');
        span.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'delete';
        del.type = 'button';
        del.textContent = 'Delete';

        li.append(span, del);
        list.appendChild(li);
      }
    }

    function save() {
      localStorage.setItem('todo-items', JSON.stringify(tasks));
    }
    function load() {
      try {
        return JSON.parse(localStorage.getItem('todo-items')) || [];
      } catch {
        return [];
      }
    }
  </script>
</body>
</html>
