<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrapping Card Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f8f9fa;
    }

    .main {
    display: flex;
    flex-wrap: wrap;  
    gap: 15px;         
    justify-content: center; 
    background-color: rgb(207, 209, 208);
    padding: 20px;   
    border-radius: 10px; 
    }


    .card {
      background: #ffffff;
      width: 200px;       
      padding: 20px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="card">
      <h3>Card 1</h3>
    </div>
    <div class="card">
      <h3>Card 2</h3>
    </div>
    <div class="card">
      <h3>Card 3</h3>
    </div>
    <div class="card">
      <h3>Card 4</h3>
    </div>
    <div class="card">
      <h3>Card 5</h3>
    </div>
    <div class="card">
      <h3>Card 6</h3>
    </div>
  </div>

</body>
</html>
