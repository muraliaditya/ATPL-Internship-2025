<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card</title>
  <style>
    .card {
      width: 250px;
      margin: 50px auto; /* centers horizontally */
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      border-bottom: 1px solid #eee;
      margin-bottom: 10px;
    }
    .card p {
      margin: 10px 0;
    }
    .card button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    .card button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/250x150" alt="Product">
    <p><strong>Product Name</strong></p>
    <p>$29.99</p>
    <button>Buy Now</button>
  </div>
</body>
</html>
