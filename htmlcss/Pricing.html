<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Table</title>
  <style>
    .pricing {
      text-align: center;
      margin-top: 40px;
    }
    .plan {
      display: inline-block;
      width: 250px;
      margin: 10px;
      border: 1px solid #ccc;
      padding: 20px;
      vertical-align: top;
    }
    .plan h3 {
      margin-bottom: 10px;
    }
    .plan ul {
      list-style: none;
      padding: 0;
    }
    .plan ul li {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="pricing">
    <div class="plan">
      <h3>Basic</h3>
      <p>$9.99</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
      </ul>
    </div>
    <div class="plan">
      <h3>Standard</h3>
      <p>$19.99</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
        <li>Feature 3</li>
      </ul>
    </div>
    <div class="plan">
      <h3>Premium</h3>
      <p>$29.99</p>
      <ul>
        <li>Feature 1</li>
        <li>Feature 2</li>
      </ul>
    </div>
  </div>
</body>
</html>
