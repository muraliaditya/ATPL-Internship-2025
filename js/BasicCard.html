<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Cards</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; padding: 20px; }
    .container { display: flex; gap: 15px; flex-wrap: wrap; }
    .card { background: white; padding: 15px; border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); width: 150px; text-align: center; }
    .card h3 { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>User Cards</h2>
  <div class="container" id="userCards"></div>

  <script>
    const users = [
      { name: "John", age: 25 },
      { name: "Rita", age: 22 },
      { name: "Sam", age: 30 }
    ];

    let container = document.getElementById("userCards");
    users.forEach(user => {
      let card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3>${user.name}</h3><p>Age: ${user.age}</p>`;
      container.appendChild(card);
    });
  </script>
</body>
</html>
